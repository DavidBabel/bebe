<!DOCTYPE html>

<title>Nos liens précieux</title>

<style>
  :root{
    --ink:#2c2620;
    --focus-bg: rgba(196, 168, 100, 0.22);
    --ok-bg: rgba(76, 175, 80, 0.32);
    --ok-fg: #1b5e20;
    --ko-bg: rgba(229, 57, 53, 0.28);
    --ko-fg: #b71c1c;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    padding:0;
    background:#3a3733;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 18px 12px 30px;
  }
  .page-wrap{
    width:100%;
    max-width:900px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .scroll-wrap{
    width:100%;
  }
  .poster{
    position:relative;
    width:100%;
    line-height:0;
    container-type: inline-size;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .cell{
    position:absolute;
    left: var(--l);
    top: var(--t);
    width: var(--w);
    height: var(--h);
    border:none;
    outline:none;
    background:transparent;
    text-align:center;
    text-transform:uppercase;
    font-family: "Courier New", "Consolas", "SFMono-Regular", ui-monospace, monospace;
    font-weight:700;
    color:var(--ink);
    caret-color:var(--ink);
    padding:0;
    margin:0;
    /* la case fait déjà ~4% de large / ~8% de haut : la police suit la largeur du poster */
    font-size: clamp(11px, 3cqw, 34px);
    border-radius: 3px;
    transition: background-color .18s ease, color .18s ease, left .18s ease, width .18s ease;
  }
  .cell.shaded{
    color:#2c2620;
  }
  .cell:focus{
    background: var(--focus-bg);
  }
  .cell.correct{
    background: var(--ok-bg);
    color: var(--ok-fg);
  }
  .cell.incorrect{
    background: var(--ko-bg);
    color: var(--ko-fg);
  }
  .hint{
    width:100%;
    max-width:640px;
    text-align:center;
    color:#cfcac0;
    font-size:13px;
    line-height:1.5;
    margin: 16px 0 4px;
  }
  .reset-btn{
    margin-top:6px;
    background:none;
    border:1px solid #6b665d;
    color:#cfcac0;
    font-size:12px;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
  }
  .reset-btn:hover{
    background:#4a463f;
  }
  .reset-btn:active{
    transform: scale(0.97);
  }

  /* Sur téléphone : on rogne 15% de l'image de chaque côté (gauche/droite)
     pour que la grille remplisse mieux l'écran, sans zone de fond inutile. */
  @media (max-width: 640px){
    .poster{
      overflow:hidden;
      aspect-ratio: 1.4481;   /* (largeur image * 0.70) / hauteur image */
    }
    .poster-img{
      position:absolute;
      top:0;
      left:50%;
      width:auto;
      height:100%;
      max-width:none;
      transform:translateX(-50%);
    }
    .cell{
      left: calc((var(--l) - 15%) / 0.7);
      width: calc(var(--w) / 0.7);
    }
  }
</style>

  <p class="hint">Touchez une case pour écrire une lettre. Le mot vertical se colore en vert si la lettre est correcte, en rouge sinon. Les réponses sont sauvegardées automatiquement sur cet appareil.</p>
  <button class="reset-btn" id="resetBtn" type="button">Effacer mes réponses</button>
</div>

<script>
(function(){
  var STORAGE_KEY = "nosLiensPrecieux_answers";
  var poster = document.getElementById("poster");
  var cells = Array.prototype.slice.call(poster.querySelectorAll("input.cell"));

  // mot vertical à valider : OLIVIA, réparti sur les cases grisées de haut en bas
  var VERTICAL_WORD = ["O","L","I","V","I","A"];
  var verticalIds = ["r1c1","r2c5","r3c3","r4c3","r5c4","r6c3"];
  var verticalAnswer = {};
  verticalIds.forEach(function(id, i){ verticalAnswer[id] = VERTICAL_WORD[i]; });

  function checkVertical(input){
    var expected = verticalAnswer[input.id];
    if(expected === undefined) return;
    input.classList.remove("correct", "incorrect");
    if(!input.value) return;
    if(input.value.toUpperCase() === expected){
      input.classList.add("correct");
    }else{
      input.classList.add("incorrect");
    }
  }

  // groupe les cases par rangée, dans l'ordre des colonnes, pour la navigation au clavier
  var rows = {};
  cells.forEach(function(input){
    var r = input.dataset.row;
    if(!rows[r]) rows[r] = [];
    rows[r].push(input);
  });

  function loadAnswers(){
    var saved = {};
    try{
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    }catch(e){ saved = {}; }
    cells.forEach(function(input){
      if(saved[input.id]) input.value = saved[input.id];
      checkVertical(input);
    });
  }

  function saveAnswer(input){
    var saved = {};
    try{
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    }catch(e){ saved = {}; }
    if(input.value){
      saved[input.id] = input.value;
    }else{
      delete saved[input.id];
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  }

  function focusInput(input){
    if(!input) return;
    input.focus();
    // sélectionne le contenu pour pouvoir retaper directement par-dessus
    try{ input.setSelectionRange(0, 1); }catch(e){}
  }

  cells.forEach(function(input){
    var rowList = rows[input.dataset.row];
    var idx = rowList.indexOf(input);

    input.addEventListener("input", function(){
      input.value = input.value.slice(-1).toUpperCase();
      saveAnswer(input);
      checkVertical(input);
      if(input.value && idx < rowList.length - 1){
        focusInput(rowList[idx + 1]);
      }
    });

    input.addEventListener("keydown", function(e){
      if(e.key === "Backspace" && !input.value && idx > 0){
        e.preventDefault();
        focusInput(rowList[idx - 1]);
      }else if(e.key === "ArrowRight" && idx < rowList.length - 1){
        e.preventDefault();
        focusInput(rowList[idx + 1]);
      }else if(e.key === "ArrowLeft" && idx > 0){
        e.preventDefault();
        focusInput(rowList[idx - 1]);
      }
    });

    input.addEventListener("focus", function(){
      try{ input.setSelectionRange(0, 1); }catch(e){}
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("Effacer toutes les réponses saisies ?")) return;
    localStorage.removeItem(STORAGE_KEY);
    cells.forEach(function(input){
      input.value = "";
      input.classList.remove("correct", "incorrect");
    });
  });

  loadAnswers();
})();
</script>
