  *{ box-sizing:border-box; }
  html,body{
    margin:0;
    padding:0;
    background:#3a3733;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 18px 0 30px;
  }
  .scroll-wrap{
    width:100%;
    max-width:1100px;
    overflow-x:auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 4px;
  }
  .poster{
    position:relative;
    width:100%;
    min-width:720px;      /* évite que la grille devienne illisible sur très petit écran : on scrolle horizontalement à la place */
    line-height:0;
    container-type: inline-size;
  }
  .poster-img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .cell{
    position:absolute;
    border:none;
    outline:none;
    background:transparent;
    text-align:center;
    text-transform:uppercase;
    font-family: "Courier New", "Consolas", "SFMono-Regular", ui-monospace, monospace;
    font-weight:700;
    color:var(--ink);
    caret-color:var(--ink);
    padding:0;
    margin:0;
    /* la case fait déjà ~4% de large / ~8% de haut : la police suit la largeur du poster */
    font-size: 3cqw;
    border-radius: 2px;
  }
  .cell.shaded{
    color:#2c2620;
  }
  .cell:focus{
    background: var(--focus-bg);
  }
  .hint{
    max-width:640px;
    text-align:center;
    color:#cfcac0;
    font-size:13px;
    line-height:1.5;
    margin: 16px 14px 4px;
  }
  .reset-btn{
    margin-top:6px;
    background:none;
    border:1px solid #6b665d;
    color:#cfcac0;
    font-size:12px;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
  }
  .reset-btn:hover{
    background:#4a463f;
  }
  .reset-btn:active{
    transform: scale(0.97);
  }
</style>

  <p class="hint">Touchez une case pour écrire une lettre. Les réponses sont sauvegardées automatiquement sur cet appareil.</p>
  <button class="reset-btn" id="resetBtn" type="button">Effacer mes réponses</button>

<script>
(function(){
  var STORAGE_KEY = "nosLiensPrecieux_answers";
  var poster = document.getElementById("poster");
  var cells = Array.prototype.slice.call(poster.querySelectorAll("input.cell"));

  // groupe les cases par rangée, dans l'ordre des colonnes, pour la navigation au clavier
  var rows = {};
  cells.forEach(function(input){
    var r = input.dataset.row;
    if(!rows[r]) rows[r] = [];
    rows[r].push(input);
  });

  function loadAnswers(){
    var saved = {};
    try{
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    }catch(e){ saved = {}; }
    cells.forEach(function(input){
      if(saved[input.id]) input.value = saved[input.id];
    });
  }

  function saveAnswer(input){
    var saved = {};
    try{
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    }catch(e){ saved = {}; }
    if(input.value){
      saved[input.id] = input.value;
    }else{
      delete saved[input.id];
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  }

  function focusInput(input){
    if(!input) return;
    input.focus();
    // sélectionne le contenu pour pouvoir retaper directement par-dessus
    try{ input.setSelectionRange(0, 1); }catch(e){}
  }

  cells.forEach(function(input){
    var rowList = rows[input.dataset.row];
    var idx = rowList.indexOf(input);

    input.addEventListener("input", function(){
      input.value = input.value.slice(-1).toUpperCase();
      saveAnswer(input);
      if(input.value && idx < rowList.length - 1){
        focusInput(rowList[idx + 1]);
      }
    });

    input.addEventListener("keydown", function(e){
      if(e.key === "Backspace" && !input.value && idx > 0){
        e.preventDefault();
        focusInput(rowList[idx - 1]);
      }else if(e.key === "ArrowRight" && idx < rowList.length - 1){
        e.preventDefault();
        focusInput(rowList[idx + 1]);
      }else if(e.key === "ArrowLeft" && idx > 0){
        e.preventDefault();
        focusInput(rowList[idx - 1]);
      }
    });

    input.addEventListener("focus", function(){
      try{ input.setSelectionRange(0, 1); }catch(e){}
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("Effacer toutes les réponses saisies ?")) return;
    localStorage.removeItem(STORAGE_KEY);
    cells.forEach(function(input){ input.value = ""; });
  });

  loadAnswers();
})();
</script>
